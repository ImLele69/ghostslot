[package]
name = "ghostslot"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
aes = "0.9.4"
anyhow = "1.0.104"
cfb8 = "0.9.1"
dirs = "7.0.0"
eframe = "0.37.0"
flate2 = "1.1.11"
hickory-resolver = "0.26.3"
rand = "0.10.4"
rsa = { version = "0.10.0", features = ["pkcs1v15"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }
ureq = { version = "3.5.2", features = ["json"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
sysinfo = "0.40.4"
